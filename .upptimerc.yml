# EvenLoad status page (Upptime). Decision and setup: ADR 0097 and AWS-SETUP.md "Status page"
# in mdpolzin/EvenLoad. Checks run every 5 minutes on GitHub-hosted runners, outside our AWS stack.
owner: mdpolzin
repo: evenload-status

# Dev endpoints until prod launches; then switch each URL to its prod host (AWS-SETUP "Status page").
sites:
  - name: API
    url: https://api.dev.evenloadapp.com/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Web app
    url: https://app.dev.evenloadapp.com
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Sign-in
    url: https://cognito-idp.us-west-2.amazonaws.com/us-west-2_YOiAMZ6gV/.well-known/openid-configuration
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  # Ask, document reading and reminders: their CloudWatch alarm states via the API's GET /status
  # (#1065), so checks never spend model or OCR calls. A part reads degraded while one of its
  # alarms fires; those alarms exist in prod only, so on dev they always read ok.
  - name: Ask
    url: https://api.dev.evenloadapp.com/status
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_degraded_if_text_missing: '"ask":"ok"'
  - name: Document reading
    url: https://api.dev.evenloadapp.com/status
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_degraded_if_text_missing: '"documents":"ok"'
  - name: Reminders
    url: https://api.dev.evenloadapp.com/status
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_degraded_if_text_missing: '"reminders":"ok"'

assignees:
  - mdpolzin

status-website:
  cname: status.evenloadapp.com
  name: EvenLoad status
  introTitle: "EvenLoad system status"
  introMessage: Live checks every 5 minutes. Incidents and maintenance are posted here.
  navbar:
    - title: Status
      href: /
    - title: Incidents
      href: https://github.com/$OWNER/$REPO/issues
